name: Nightly regression

# PLAN.md 8.4. The per-PR pipeline is budgeted at fifteen minutes and cannot carry the full corpus,
# fuzzing, determinism, and performance work. This job can take hours, and the things it checks are
# the ones that decay silently: determinism, robustness, and the golden values that make a
# regression visible at all.

on:
  schedule:
    # 03:00 UTC daily. No particular reason beyond being outside working hours.
    - cron: '0 3 * * *'
  # No kernel input yet: 'occt' is not a runnable choice until P1-T06, and an input the job
  # silently ignored would be worse than not offering it. Add it back, wired into the matrix with
  # fromJSON, when there is a second kernel to choose.
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  corpus:
    name: Corpus and determinism (${{ matrix.kernel }})
    runs-on: windows-latest
    timeout-minutes: 180

    strategy:
      fail-fast: false
      matrix:
        # Both, every night. The fake kernel is the fast signal and the reference; OCCT is what
        # ships. A fixture that passes against one and fails against the other is the abstraction
        # (ADR-0002) breaking, which is exactly what this corpus exists to catch.
        kernel: [fake, occt]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # OCCT from source is most of an hour cold and seconds warm, so the binary cache carries
      # the nightly as much as it carries CI.
      - name: Cache vcpkg binaries
        uses: actions/cache@v4
        with:
          path: ~/AppData/Local/vcpkg/archives
          key: vcpkg-${{ runner.os }}-${{ hashFiles('native/vcpkg.json') }}
          restore-keys: vcpkg-${{ runner.os }}-

      # Built through build.ps1 rather than dotnet build, because the corpus needs the native
      # shim and its OCCT dependency closure beside the runner, and only the native step produces
      # those.
      - name: Build
        shell: pwsh
        run: ./build.ps1 -Configuration Release -WithOcct -SkipTests -SkipRegression

      - name: Run the corpus with the determinism gate
        shell: pwsh
        run: |
          # ADR-0011: the corpus runs twice on fresh kernels and the topology and role signatures
          # are diffed. A difference is a P0 even when every fixture still passes, because
          # non-determinism corrupts undo, caching, and naming in ways that surface months later
          # as unrelated intermittent bugs.
          & ./artifacts/bin/OpenMCAD.Regression/release/omcad-regress.exe `
              --kernel ${{ matrix.kernel }} --verbose --determinism
          if ($LASTEXITCODE -ne 0) { throw "Regression corpus failed (exit $LASTEXITCODE)" }

      - name: Run the full test suite
        shell: pwsh
        run: ./build.ps1 -Configuration Release -WithOcct -SkipRegression

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-test-results-${{ matrix.kernel }}
          path: artifacts/test-results/**/*.trx
          if-no-files-found: warn

  no-cache:
    name: Rebuild from scratch
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Clean build and full suite
        shell: pwsh
        run: |
          # PLAN.md 8.4 weekly item, run nightly because it is cheap while the corpus is small:
          # prove that nothing depends on incremental build state or a warm cache.
          ./build.ps1 -Clean -Configuration Release
