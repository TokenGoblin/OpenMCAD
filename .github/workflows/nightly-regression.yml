name: Nightly regression

# PLAN.md 8.4. The per-PR pipeline is budgeted at fifteen minutes and cannot carry the full corpus,
# fuzzing, determinism, and performance work. This job can take hours, and the things it checks are
# the ones that decay silently: determinism, robustness, and the golden values that make a
# regression visible at all.

on:
  schedule:
    # 03:00 UTC daily. No particular reason beyond being outside working hours.
    - cron: '0 3 * * *'
  # No kernel input yet: 'occt' is not a runnable choice until P1-T06, and an input the job
  # silently ignored would be worse than not offering it. Add it back, wired into the matrix with
  # fromJSON, when there is a second kernel to choose.
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  corpus:
    name: Corpus and determinism (${{ matrix.kernel }})
    runs-on: windows-latest
    # OCCT from source is the long pole: a two-core runner did not finish debug and release in
    # two hours, and the per-push workflow gave up trying. Nightly is where that cost belongs --
    # it runs unattended, and running every night keeps the binary cache warm, which is what stops
    # it being paid again. GitHub evicts a cache after seven days unused, so a workflow that only
    # ran occasionally would rebuild from cold nearly every time.
    timeout-minutes: 330

    strategy:
      fail-fast: false
      matrix:
        # Both, every night. The fake kernel is the fast signal and the reference; OCCT is what
        # ships. A fixture that passes against one and fails against the other is the abstraction
        # (ADR-0002) breaking, which is exactly what this corpus exists to catch.
        kernel: [fake, occt]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # OCCT from source is most of an hour cold and seconds warm, so the binary cache carries
      # the nightly as much as it carries CI.
      - name: Cache vcpkg binaries
        uses: actions/cache@v4
        with:
          path: ~/AppData/Local/vcpkg/archives
          key: vcpkg-${{ runner.os }}-${{ hashFiles('native/vcpkg.json') }}
          restore-keys: vcpkg-${{ runner.os }}-

      # The runner's preinstalled vcpkg is a shallow clone pinned to whatever commit the image
      # happened to ship with, so the builtin-baseline in native/vcpkg.json is almost never in its
      # history and `vcpkg install` fails before it does any work: "failed to git show
      # versions/baseline.json". Fetching the single pinned commit is far cheaper than unshallowing
      # the whole of microsoft/vcpkg, and keeps the pin doing its job -- loosening the baseline to
      # whatever the image has would make the dependency set vary by runner image, which ADR-0011
      # exists to prevent.
      - name: Make the pinned vcpkg baseline available
        shell: pwsh
        run: |
          $baseline = (Get-Content native/vcpkg.json -Raw | ConvertFrom-Json).'builtin-baseline'
          $root = $env:VCPKG_INSTALLATION_ROOT
          Write-Host "Fetching vcpkg baseline $baseline into $root"

          git -C $root fetch --depth 1 origin $baseline
          if ($LASTEXITCODE -ne 0) {
            # Older servers refuse a fetch by bare SHA. Unshallowing is slower but always works.
            Write-Host 'Fetch by commit failed; unshallowing instead.'
            git -C $root fetch --unshallow
            if ($LASTEXITCODE -ne 0) { throw 'Could not make the pinned vcpkg baseline available.' }
          }

      # Built through build.ps1 rather than dotnet build, because the corpus needs the native
      # shim and its OCCT dependency closure beside the runner, and only the native step produces
      # those.
      - name: Build
        shell: pwsh
        run: ./build.ps1 -Configuration Release -WithOcct -SkipTests -SkipRegression

      - name: Record what the kernel build cost
        if: always()
        shell: pwsh
        run: |
          # Printed so the cost is visible in the log rather than inferred from the job duration.
          # If this is minutes the cache held; if it is an hour the cache was evicted or the pinned
          # OCCT version changed, and the next nightly should be back to minutes.
          $installed = 'native/vcpkg_installed/x64-windows/lib'
          if (Test-Path $installed) {
            $count = (Get-ChildItem $installed -Filter '*.lib').Count
            Write-Host "vcpkg produced $count static libraries under $installed"
          }

      - name: Run the corpus with the determinism gate
        shell: pwsh
        run: |
          # ADR-0011: the corpus runs twice on fresh kernels and the topology and role signatures
          # are diffed. A difference is a P0 even when every fixture still passes, because
          # non-determinism corrupts undo, caching, and naming in ways that surface months later
          # as unrelated intermittent bugs.
          & ./artifacts/bin/OpenMCAD.Regression/release/omcad-regress.exe `
              --kernel ${{ matrix.kernel }} --verbose --determinism
          if ($LASTEXITCODE -ne 0) { throw "Regression corpus failed (exit $LASTEXITCODE)" }

      - name: Run the full test suite
        shell: pwsh
        run: ./build.ps1 -Configuration Release -WithOcct -SkipRegression

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-test-results-${{ matrix.kernel }}
          path: artifacts/test-results/**/*.trx
          if-no-files-found: warn

  no-cache:
    name: Rebuild from scratch
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Clean build and full suite
        shell: pwsh
        run: |
          # PLAN.md 8.4 weekly item, run nightly because it is cheap while the corpus is small:
          # prove that nothing depends on incremental build state or a warm cache.
          ./build.ps1 -Clean -Configuration Release
